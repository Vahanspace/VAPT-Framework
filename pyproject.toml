[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vapt-framework"
version = "0.1.0"
description = "Guardrailed, test-driven VAPT automation framework"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0","requests>=2.31","openpyxl>=3.1","jinja2>=3.1","jsonschema>=4.20"]

[tool.setuptools]
packages = ["vaptframework","vaptframework.core","vaptframework.scanners","vaptframework.reporting","vaptframework.testplan"]
